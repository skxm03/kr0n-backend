gateway:
  http_addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_body_bytes: 4194304

  middleware:
    - request_id
    - recovery
    - access_log

middleware_profiles:
  public_api:
    - cors:
        allow_credentials: true
    - request_validation
    - rate_limit:
        requests: 100
        window: 1m

  authenticated_api:
    - cors:
        allow_credentials: true
    - audit_log
    - authentication:
        allow_api_tokens: true
    - rate_limit:
        requests: 300
        window: 1m

  sensitive_api:
    - cors:
        allow_credentials: true
    - audit_log
    - authentication:
        allow_api_tokens: true
    - rate_limit:
        requests: 50
        window: 1m

services:
  auth:
    address: "${AUTH_GRPC_ADDR}"
    enabled: true
    timeout: 10s
    default_profile: authenticated_api
    tls:
      ca_file: "${AUTH_GRPC_TLS_CA_FILE:-}"
      cert_file: "${GATEWAY_GRPC_TLS_CERT_FILE:-}"
      key_file: "${GATEWAY_GRPC_TLS_KEY_FILE:-}"
      server_name: "${AUTH_GRPC_SERVER_NAME:-auth.internal}"

    middleware:
      - cors

    groups:
      public_auth:
        match:
          - path: "/api/v1/auth/*"
            type: prefix
            methods: [POST]
          - path: "/api/v1/auth/jwks"
            type: exact
            methods: [GET]
          - path: "/api/v1/auth/github/*"
            type: prefix
            methods: [GET]
        use:
          - public_api

      sensitive_ops:
        match:
          - path: "/api/v1/orgs"
            type: exact
            methods: [POST]
          - path: "/api/v1/orgs/*"
            type: prefix
            methods: [POST, PUT, PATCH, DELETE]
        use:
          - sensitive_api

  github:
    address: "${GITHUB_GRPC_ADDR:-127.0.0.1:50052}"
    enabled: true
    timeout: 10s
    default_profile: authenticated_api
    tls:
      ca_file: "${GITHUB_GRPC_TLS_CA_FILE:-}"
      cert_file: "${GATEWAY_GRPC_TLS_CERT_FILE:-}"
      key_file: "${GATEWAY_GRPC_TLS_KEY_FILE:-}"
      server_name: "${GITHUB_GRPC_SERVER_NAME:-github.internal}"

    middleware:
      - cors
