gateway:
  http_addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_body_bytes: 4194304

  middleware:
    - request_id
    - recovery
    - access_log

middleware_profiles:
  public_api:
    - cors:
        allow_credentials: true
    - request_validation
    - rate_limit:
        zone: public
        key: ip
        requests: 100
        window: 1m

  authenticated_api:
    - cors:
        allow_credentials: true
    - audit_log
    - authentication:
        allow_api_tokens: true
    - rate_limit:
        zone: authenticated
        key: user
        requests: 300
        window: 1m

  sensitive_api:
    - cors:
        allow_credentials: true
    - audit_log
    - authentication:
        allow_api_tokens: true
    - rate_limit:
        zone: sensitive
        key: user
        requests: 50
        window: 1m
        fail_open: false

  webhook_ingress:
    - recovery
    - request_id
    - audit_log

services:
  auth:
    address: "${AUTH_GRPC_ADDR}"
    enabled: true
    timeout: 10s
    default_profile: authenticated_api
    tls:
      ca_file: "${AUTH_GRPC_TLS_CA_FILE:-}"
      cert_file: "${GATEWAY_GRPC_TLS_CERT_FILE:-}"
      key_file: "${GATEWAY_GRPC_TLS_KEY_FILE:-}"
      server_name: "${AUTH_GRPC_SERVER_NAME:-auth.internal}"

    middleware:
      - cors

    groups:
      public_auth:
        match:
          - path: "/api/v1/auth/register"
            type: exact
            methods: [POST]
          - path: "/api/v1/auth/login"
            type: exact
            methods: [POST]
          - path: "/api/v1/auth/refresh"
            type: exact
            methods: [POST]
          - path: "/api/v1/auth/verify-email"
            type: exact
            methods: [POST]
          - path: "/api/v1/auth/resend-verification"
            type: exact
            methods: [POST]
          - path: "/api/v1/auth/password-reset/*"
            type: prefix
            methods: [POST]
          - path: "/api/v1/auth/jwks"
            type: exact
            methods: [GET]
          - path: "/api/v1/auth/github/*"
            type: prefix
            methods: [GET]
          - path: "/api/v1/auth/google/*"
            type: prefix
            methods: [GET]
        use:
          - public_api

      sensitive_ops:
        match:
          - path: "/api/v1/orgs"
            type: exact
            methods: [POST]
          - path: "/api/v1/orgs/*"
            type: prefix
            methods: [POST, PUT, PATCH, DELETE]
        use:
          - sensitive_api

      webhooks:
        match:
          - path: "/api/v1/github/webhooks"
            type: exact
            methods: [POST]
        use:
          - webhook_ingress

  github:
    address: "${GITHUB_GRPC_ADDR:-127.0.0.1:50052}"
    enabled: true
    timeout: 10s
    default_profile: authenticated_api
    tls:
      ca_file: "${GITHUB_GRPC_TLS_CA_FILE:-}"
      cert_file: "${GATEWAY_GRPC_TLS_CERT_FILE:-}"
      key_file: "${GATEWAY_GRPC_TLS_KEY_FILE:-}"
      server_name: "${GITHUB_GRPC_SERVER_NAME:-github.internal}"

    middleware:
      - cors

  servicemanager:
    address: "${SERVICEMANAGER_GRPC_ADDR:-127.0.0.1:50053}"
    enabled: true
    timeout: 10s
    default_profile: authenticated_api
    tls:
      ca_file: "${SERVICEMANAGER_GRPC_TLS_CA_FILE:-}"
      cert_file: "${GATEWAY_GRPC_TLS_CERT_FILE:-}"
      key_file: "${GATEWAY_GRPC_TLS_KEY_FILE:-}"
      server_name: "${SERVICEMANAGER_GRPC_SERVER_NAME:-servicemanager.internal}"

    middleware:
      - cors

    groups:
      sensitive_project_ops:
        match:
          - path: "/api/v1/orgs/*"
            type: prefix
            methods: [POST, PUT, PATCH, DELETE]
        use:
          - sensitive_api

  secrets:
    address: "${SECRETS_GRPC_ADDR:-127.0.0.1:50054}"
    enabled: true
    timeout: 10s
    default_profile: authenticated_api
    tls:
      ca_file: "${SECRETS_GRPC_TLS_CA_FILE:-}"
      cert_file: "${GATEWAY_GRPC_TLS_CERT_FILE:-}"
      key_file: "${GATEWAY_GRPC_TLS_KEY_FILE:-}"
      server_name: "${SECRETS_GRPC_SERVER_NAME:-secrets.internal}"

    middleware:
      - cors

    groups:
      sensitive_secret_ops:
        match:
          - path: "/api/v1/orgs/*"
            type: prefix
            methods: [POST, PUT, PATCH, DELETE]
        use:
          - sensitive_api
