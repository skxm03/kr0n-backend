gateway:
  http_addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_body_bytes: 4194304

  middleware:
    - request_id
    - recovery
    - access_log

middleware_profiles:
  public_api:
    - cors
    - request_validation
    - rate_limit:
        requests: 100
        window: 1m

  authenticated_api:
    - cors
    - authentication:
        allow_api_tokens: true
    - rate_limit:
        requests: 300
        window: 1m

  sensitive_api:
    - cors
    - authentication:
        allow_api_tokens: true
    - audit_log
    - rate_limit:
        requests: 50
        window: 1m

services:
  auth:
    address: "${AUTH_GRPC_ADDR:-localhost:50051}"
    enabled: true
    timeout: 10s
    default_profile: authenticated_api
    tls:
      enabled: false

    middleware:
      - cors

    groups:
      public_auth:
        match:
          - path: "/api/v1/auth/*"
            type: prefix
            methods: [POST]
          - path: "/api/v1/auth/jwks"
            type: exact
            methods: [GET]
          - path: "/api/v1/auth/github/*"
            type: prefix
            methods: [GET]
        use:
          - public_api

      sensitive_ops:
        match:
          - path: "/api/v1/orgs"
            type: exact
            methods: [POST]
          - path: "/api/v1/orgs/*"
            type: prefix
            methods: [POST, PUT, PATCH, DELETE]
        use:
          - sensitive_api
