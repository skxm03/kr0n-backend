gateway:
  http_addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_body_bytes: 4194304

  middleware:
    - request_id
    - recovery
    - access_log

middleware_profiles:
  public_api:
    - cors
    - request_validation
    - rate_limit:
        requests: 100
        window: 1m

  authenticated_api:
    - cors
    - authentication:
        allow_api_tokens: true
    - rate_limit:
        requests: 300
        window: 1m

  sensitive_api:
    - cors
    - authentication:
        allow_api_tokens: true
    - audit_log
    - rate_limit:
        requests: 50
        window: 1m

services:
  auth:
    address: "${AUTH_GRPC_ADDR:-localhost:50051}"
    enabled: true
    timeout: 10s
    tls:
      enabled: false

    middleware:
      - cors

    groups:
      public_auth:
        match:
          - path: "/api/v1/auth/*"
            type: prefix
            methods: [POST]
        use:
          - public_api

    endpoints:
      # Public credential & authentication routes
      - path: "/api/v1/auth/register"
        method: "POST"
        use:
          - public_api
      - path: "/api/v1/auth/login"
        method: "POST"
        use:
          - public_api
      - path: "/api/v1/auth/refresh"
        method: "POST"
        use:
          - public_api
      - path: "/api/v1/auth/logout"
        method: "POST"
        use:
          - public_api
      - path: "/api/v1/auth/verify-email"
        method: "POST"
        use:
          - public_api
      - path: "/api/v1/auth/resend-verification"
        method: "POST"
        use:
          - public_api
      - path: "/api/v1/auth/password-reset/request"
        method: "POST"
        use:
          - public_api
      - path: "/api/v1/auth/password-reset/confirm"
        method: "POST"
        use:
          - public_api

      # Personal account & session management (authenticated)
      - path: "/api/v1/auth/password/change"
        method: "POST"
        use:
          - authenticated_api
      - path: "/api/v1/me"
        method: "GET"
        use:
          - authenticated_api
      - path: "/api/v1/auth/sessions"
        method: "GET"
        use:
          - authenticated_api
      - path: "/api/v1/auth/sessions/{id}"
        method: "DELETE"
        use:
          - authenticated_api

      # Roles & Organizations (sensitive, audit-logged)
      - path: "/api/v1/roles"
        method: "GET"
        use:
          - authenticated_api
      - path: "/api/v1/orgs"
        method: "POST"
        use:
          - sensitive_api
      - path: "/api/v1/orgs"
        method: "GET"
        use:
          - authenticated_api
      - path: "/api/v1/orgs/{org_id}"
        method: "GET"
        use:
          - authenticated_api
      - path: "/api/v1/orgs/{org_id}"
        method: "PUT"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/{org_id}"
        method: "DELETE"
        use:
          - sensitive_api

      # Organization Members & Invites
      - path: "/api/v1/orgs/{org_id}/members"
        method: "GET"
        use:
          - authenticated_api
      - path: "/api/v1/orgs/{org_id}/members"
        method: "POST"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/{org_id}/members/{user_id}"
        method: "PUT"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/{org_id}/members/{user_id}"
        method: "DELETE"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/{org_id}/invites"
        method: "POST"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/{org_id}/invites"
        method: "GET"
        use:
          - authenticated_api
      - path: "/api/v1/orgs/{org_id}/invites/{invite_id}"
        method: "DELETE"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/invites/accept"
        method: "POST"
        use:
          - authenticated_api

      # API Tokens & Audit Events
      - path: "/api/v1/orgs/{org_id}/api-tokens"
        method: "POST"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/{org_id}/api-tokens"
        method: "GET"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/{org_id}/api-tokens/{token_id}"
        method: "DELETE"
        use:
          - sensitive_api
      - path: "/api/v1/orgs/{org_id}/audit-events"
        method: "GET"
        use:
          - sensitive_api
