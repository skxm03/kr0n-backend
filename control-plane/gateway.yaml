gateway:
  http_addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_body_bytes: 4194304

services:
  auth:
    address: "${AUTH_GRPC_ADDR:-localhost:50051}"
    enabled: true
    timeout: 10s
    tls:
      enabled: false

    endpoints:
      # Public credential & authentication routes
      - path: "/api/v1/auth/register"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/auth/login"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/auth/refresh"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/auth/logout"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/auth/verify-email"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/auth/resend-verification"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/auth/password-reset/request"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/auth/password-reset/confirm"
        method: "POST"
        timeout: 5s

      # Personal account & session management
      - path: "/api/v1/auth/password/change"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/me"
        method: "GET"
        timeout: 5s
      - path: "/api/v1/auth/sessions"
        method: "GET"
        timeout: 5s
      - path: "/api/v1/auth/sessions/{id}"
        method: "DELETE"
        timeout: 5s

      # Roles & Organizations
      - path: "/api/v1/roles"
        method: "GET"
        timeout: 5s
      - path: "/api/v1/orgs"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/orgs"
        method: "GET"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}"
        method: "GET"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}"
        method: "PUT"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}"
        method: "DELETE"
        timeout: 5s

      # Organization Members & Invites
      - path: "/api/v1/orgs/{org_id}/members"
        method: "GET"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/members"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/members/{user_id}"
        method: "PUT"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/members/{user_id}"
        method: "DELETE"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/invites"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/invites"
        method: "GET"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/invites/{invite_id}"
        method: "DELETE"
        timeout: 5s
      - path: "/api/v1/orgs/invites/accept"
        method: "POST"
        timeout: 5s

      # API Tokens & Audit Events
      - path: "/api/v1/orgs/{org_id}/api-tokens"
        method: "POST"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/api-tokens"
        method: "GET"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/api-tokens/{token_id}"
        method: "DELETE"
        timeout: 5s
      - path: "/api/v1/orgs/{org_id}/audit-events"
        method: "GET"
        timeout: 5s
