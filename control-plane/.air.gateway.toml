# .air.gateway.toml - Hot reload config for API Gateway Microservice
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp/gateway"

[build]
  args_bin = []
  bin = "./tmp/gateway/kr0n-gateway"
  cmd = "go build -o ./tmp/gateway/kr0n-gateway ./cmd/gateway"
  delay = 1000
  entrypoint = ["./tmp/gateway/kr0n-gateway"]
  exclude_dir = ["bin", "tmp", "vendor", "test", "certs", "scripts"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd/gateway", "internal"]
  include_ext = ["go", "yaml", "yml", "json", "env"]
  include_file = ["gateway.yaml"]
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
