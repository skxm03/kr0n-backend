syntax = "proto3";

package auth.v1;

option go_package = "github.com/skxm03/kr0n-backend/control-plane/gen/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

// AuthService defines RPC operations for identity and credentials.
service AuthService {
  // Register creates a new user and password credential.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login authenticates credentials and issues tokens with an active session.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh rotates the refresh token and issues a fresh access token.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Logout revokes the session associated with the refresh token.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // VerifyEmail validates a verification token and marks the user's email verified.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
  string client_ip = 4;
}

message LoginUser {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string status = 4;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  LoginUser user = 5;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
}
