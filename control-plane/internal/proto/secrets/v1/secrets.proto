syntax = "proto3";

package secrets.v1;

option go_package = "github.com/skxm03/kr0n-backend/control-plane/gen/secrets/v1;secretsv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "auth/v1/auth.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "kr0n Secrets & Vault API"
    version: "1.0.0"
    description: "Dedicated zero-trust microservice for envelope-encrypted Project Secrets & Environment Variables (AES-256-GCM with AAD)."
    contact: {
      name: "kr0n engineering"
      url: "https://github.com/skxm03/kr0n-backend"
    }
  }
  host: "localhost:8080"
  schemes: HTTP
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Standard JWT Bearer token format: `Bearer <access_token>`"
      }
    }
  }
  tags: [
    {
      name: "Project Secrets & Environment Variables"
      description: "Write-only envelope-encrypted project secrets and environment variables (AES-256-GCM with AAD)."
    }
  ]
};

// SecretsService provides the public write-only API for managing project environment variables.
// Raw secret plaintext is never returned by any RPC in this service.
service SecretsService {
  // UpsertProjectEnvVars creates or updates one or more write-only encrypted environment variables for a project.
  rpc UpsertProjectEnvVars(UpsertProjectEnvVarsRequest) returns (UpsertProjectEnvVarsResponse) {
    option (google.api.http) = {
      post: "/api/v1/orgs/{org_id}/projects/{project_id}/env"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["Project Secrets & Environment Variables"]
      summary: "Upsert write-only encrypted project environment variables"
      description: "Encrypts and stores one or more environment variables for a project using AES-256-GCM envelope encryption with AAD. Returns only masked metadata (`••••••••`); plaintext is never returned. Requires `project:update`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }

  // ListProjectEnvVars lists masked metadata for a project's environment variables.
  rpc ListProjectEnvVars(ListProjectEnvVarsRequest) returns (ListProjectEnvVarsResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/projects/{project_id}/env"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["Project Secrets & Environment Variables"]
      summary: "List project environment variables (masked metadata only)"
      description: "Lists environment variable keys, timestamps, and masked value indicators (`••••••••`) for a project and environment without decrypting or exposing secret values. Requires `project:read`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }

  // DeleteProjectEnvVar deletes a specific environment variable by key from a project.
  rpc DeleteProjectEnvVar(DeleteProjectEnvVarRequest) returns (DeleteProjectEnvVarResponse) {
    option (google.api.http) = {
      delete: "/api/v1/orgs/{org_id}/projects/{project_id}/env/{key}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["Project Secrets & Environment Variables"]
      summary: "Delete project environment variable"
      description: "Permanently deletes an environment variable by key for the specified project and environment. Requires `project:update`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }
}

// SecretsInternalService is a restricted internal gRPC service for the build/deployment execution engine.
// It has NO HTTP annotations and is NEVER registered on the public API Gateway.
service SecretsInternalService {
  // ResolveProjectSecrets decrypts and returns plaintext environment variables for a project and environment.
  rpc ResolveProjectSecrets(ResolveProjectSecretsRequest) returns (ResolveProjectSecretsResponse);
}

message EnvVarInput {
  string key = 1;
  string value = 2;
}

message EnvVarMetadata {
  string id = 1;
  string project_id = 2;
  string environment = 3;
  string key = 4;
  string masked_value = 5;
  bool has_value = 6;
  int32 dek_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message UpsertProjectEnvVarsRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  string project_id = 3;
  string environment = 4;
  repeated EnvVarInput variables = 5;
}

message UpsertProjectEnvVarsResponse {
  repeated EnvVarMetadata variables = 1;
}

message ListProjectEnvVarsRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  string project_id = 3;
  string environment = 4;
}

message ListProjectEnvVarsResponse {
  repeated EnvVarMetadata variables = 1;
}

message DeleteProjectEnvVarRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  string project_id = 3;
  string key = 4;
  string environment = 5;
}

message DeleteProjectEnvVarResponse {
  string message = 1;
}

message ResolveProjectSecretsRequest {
  string project_id = 1;
  string environment = 2;
}

message ResolveProjectSecretsResponse {
  map<string, string> secrets = 1;
}
