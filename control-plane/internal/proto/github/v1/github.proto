syntax = "proto3";

package github.v1;

option go_package = "github.com/skxm03/kr0n-backend/control-plane/gen/github/v1;githubv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "auth/v1/auth.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "kr0n GitHub VCS Service API"
    version: "1.0.0"
    description: "GitHub Version Control System microservice for repository exploration, branch indexing, directory discovery, and GitHub App installations."
    contact: {
      name: "kr0n engineering"
      url: "https://github.com/skxm03/kr0n-backend"
    }
  }
  host: "localhost:8080"
  schemes: HTTP
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Standard JWT Bearer token format: `Bearer <access_token>`"
      }
    }
  }
  tags: [
    {
      name: "GitHub Repositories & VCS"
      description: "Explore repositories, branches, and directory trees connected via GitHub App installations."
    },
    {
      name: "GitHub App Integrations"
      description: "Install, link, and manage organization GitHub App installations."
    }
  ]
};

// GitHubService provides GitHub repository metadata, branch navigation, file tree exploration, and GitHub App management.
service GitHubService {
  // StartGitHubInstallation generates a signed installation state token and GitHub App installation URL.
  rpc StartGitHubInstallation(StartGitHubInstallationRequest) returns (StartGitHubInstallationResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/github/installations/start"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["GitHub App Integrations"]
      summary: "Start GitHub App installation"
      description: "Initiates the GitHub App installation flow by generating a cryptographically signed HMAC state token and redirect URL. Requires `org:update`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }

  // CompleteGitHubInstallation verifies the installation state and links the GitHub App installation to the organization.
  rpc CompleteGitHubInstallation(CompleteGitHubInstallationRequest) returns (CompleteGitHubInstallationResponse) {
    option (google.api.http) = {
      post: "/api/v1/orgs/{org_id}/github/installations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["GitHub App Integrations"]
      summary: "Complete GitHub App installation"
      description: "Verifies the HMAC state token, fetches installation metadata from GitHub, and links the installation to the organization. Requires `org:update`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }

  // ListGitHubInstallations lists GitHub App installations linked to the organization.
  rpc ListGitHubInstallations(ListGitHubInstallationsRequest) returns (ListGitHubInstallationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/github/installations"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["GitHub App Integrations"]
      summary: "List GitHub App installations"
      description: "Returns all active or suspended GitHub App installations associated with the specified organization. Requires `org:read`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }

  // DisconnectGitHubInstallation unlinks a GitHub App installation from the organization.
  rpc DisconnectGitHubInstallation(DisconnectGitHubInstallationRequest) returns (DisconnectGitHubInstallationResponse) {
    option (google.api.http) = {
      delete: "/api/v1/orgs/{org_id}/github/installations/{installation_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["GitHub App Integrations"]
      summary: "Disconnect GitHub App installation"
      description: "Removes an active GitHub App installation linkage from the organization and revokes cached installation tokens. Requires `org:update`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }

  // GetGitHubInstallationToken exchanges organization permissions and caller principal for a scoped GitHub App installation token.
  // Internal service-to-service RPC used by satellite services.
  rpc GetGitHubInstallationToken(GetGitHubInstallationTokenRequest) returns (GetGitHubInstallationTokenResponse);

  // HandleGitHubWebhook verifies and processes raw GitHub App webhook payloads (ping, installation, installation_repositories).
  rpc HandleGitHubWebhook(HandleGitHubWebhookRequest) returns (HandleGitHubWebhookResponse);

  // ListRepositories lists GitHub repositories accessible to an organization installation.
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/github/repositories"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["GitHub Repositories & VCS"]
      summary: "List accessible GitHub repositories"
      description: "Queries the GitHub API via installation credentials to list all repositories accessible to the linked organization installation. Requires `github:read`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }

  // ListBranches lists branches in a GitHub repository accessible to an organization installation.
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/github/repositories/{owner}/{repo}/branches"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["GitHub Repositories & VCS"]
      summary: "List repository branches"
      description: "Returns branch names, latest commit SHAs, and protection status for a given GitHub repository. Requires `github:read`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }

  // ListDirectories lists canonical root directory paths (e.g. "/", "/apps/api") in a GitHub repository ref.
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/github/repositories/{owner}/{repo}/directories"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["GitHub Repositories & VCS"]
      summary: "List repository directory structure"
      description: "Discovers canonical directory structures (e.g. root '/', monorepo app subdirectories) at a given git commit/ref to assist workspace discovery. Requires `github:read`."
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
    };
  }
}

message GitHubInstallationInfo {
  string id = 1;
  string org_id = 2;
  int64 installation_id = 3;
  string account_login = 4;
  string account_type = 5;
  string repository_selection = 6;
  string status = 7;
  string created_by_user_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message StartGitHubInstallationRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
}

message StartGitHubInstallationResponse {
  string install_url = 1;
  string state = 2;
}

message CompleteGitHubInstallationRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  int64 installation_id = 3;
  string state = 4;
}

message CompleteGitHubInstallationResponse {
  GitHubInstallationInfo installation = 1;
}

message ListGitHubInstallationsRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
}

message ListGitHubInstallationsResponse {
  repeated GitHubInstallationInfo installations = 1;
}

message DisconnectGitHubInstallationRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  int64 installation_id = 3;
}

message DisconnectGitHubInstallationResponse {
  string message = 1;
}

message GetGitHubInstallationTokenRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  int64 installation_id = 3;
}

message GetGitHubInstallationTokenResponse {
  string token = 1;
  int64 installation_id = 2;
  int64 expires_at_unix = 3;
}

message HandleGitHubWebhookRequest {
  bytes payload = 1;
  string signature_header = 2;
  string event_type = 3;
  string delivery_id = 4;
}

message HandleGitHubWebhookResponse {
  string status = 1;
}

message GitHubRepositoryInfo {
  int64 id = 1;
  string owner = 2;
  string name = 3;
  string full_name = 4;
  bool private = 5;
  string default_branch = 6;
  string html_url = 7;
  string updated_at = 8;
  string pushed_at = 9;
  string description = 10;
  string language = 11;
}

message ListRepositoriesRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  int64 installation_id = 3;
}

message ListRepositoriesResponse {
  repeated GitHubRepositoryInfo repositories = 1;
}

message GitHubBranchInfo {
  string name = 1;
  string commit_sha = 2;
  bool protected = 3;
}

message ListBranchesRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  int64 installation_id = 3;
  string owner = 4;
  string repo = 5;
}

message ListBranchesResponse {
  repeated GitHubBranchInfo branches = 1;
}

message ListDirectoriesRequest {
  auth.v1.CallerPrincipal caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {read_only: true}];
  string org_id = 2;
  int64 installation_id = 3;
  string owner = 4;
  string repo = 5;
  string ref = 6;
  string path = 7;
}

message DirectoryEntry {
  string path = 1;
  string name = 2;
  string parent_path = 3;
  string detected_preset = 4;
  string suggested_install_command = 5;
  string suggested_build_command = 6;
  string suggested_run_command = 7;
  string suggested_output_directory = 8;
  bool has_children = 9;
}

message DirectoryNode {
  string path = 1;
  string name = 2;
  repeated DirectoryNode children = 3;
  string detected_preset = 4;
  string suggested_install_command = 5;
  string suggested_build_command = 6;
  string suggested_run_command = 7;
  string suggested_output_directory = 8;
  bool has_children = 9;
}

message ListDirectoriesResponse {
  repeated string directories = 1;
  repeated DirectoryEntry entries = 2;
  DirectoryNode root = 3;
  DirectoryEntry current_directory = 4;
  repeated DirectoryEntry children = 5;
}
