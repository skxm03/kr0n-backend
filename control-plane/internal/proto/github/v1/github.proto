syntax = "proto3";

package github.v1;

option go_package = "github.com/skxm03/kr0n-backend/control-plane/gen/github/v1;githubv1";

import "google/api/annotations.proto";
import "auth/v1/auth.proto";

// GitHubService provides GitHub repository metadata, branch navigation, and file tree exploration.
service GitHubService {
  // ListRepositories lists GitHub repositories accessible to an organization installation.
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/github/repositories"
    };
  }

  // ListBranches lists branches in a GitHub repository accessible to an organization installation.
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/github/repositories/{owner}/{repo}/branches"
    };
  }

  // ListDirectories lists canonical root directory paths (e.g. "/", "/apps/api") in a GitHub repository ref.
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/orgs/{org_id}/github/repositories/{owner}/{repo}/directories"
    };
  }
}

message GitHubRepositoryInfo {
  int64 id = 1;
  string owner = 2;
  string name = 3;
  string full_name = 4;
  bool private = 5;
  string default_branch = 6;
  string html_url = 7;
}

message ListRepositoriesRequest {
  auth.v1.CallerPrincipal caller = 1;
  string org_id = 2;
  int64 installation_id = 3;
}

message ListRepositoriesResponse {
  repeated GitHubRepositoryInfo repositories = 1;
}

message GitHubBranchInfo {
  string name = 1;
  string commit_sha = 2;
  bool protected = 3;
}

message ListBranchesRequest {
  auth.v1.CallerPrincipal caller = 1;
  string org_id = 2;
  int64 installation_id = 3;
  string owner = 4;
  string repo = 5;
}

message ListBranchesResponse {
  repeated GitHubBranchInfo branches = 1;
}

message ListDirectoriesRequest {
  auth.v1.CallerPrincipal caller = 1;
  string org_id = 2;
  int64 installation_id = 3;
  string owner = 4;
  string repo = 5;
  string ref = 6;
}

message ListDirectoriesResponse {
  repeated string directories = 1;
}
