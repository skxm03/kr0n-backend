name: kr0n

include:
  - path: ./mailer/compose.yaml
  - path: ./audit/compose.yaml
  - path: ./auth/compose.yaml
  - path: ./gateway/compose.yaml

services:
  auth:
    depends_on:
      mailer-rabbitmq:
        condition: service_healthy
      audit-rabbitmq:
        condition: service_healthy
  audit:
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
  gateway:
    depends_on:
      auth:
        condition: service_healthy
      audit-rabbitmq:
        condition: service_healthy
