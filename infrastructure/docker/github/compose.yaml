name: kr0n-github

services:
  github:
    build:
      context: ../../../control-plane
      dockerfile: ../infrastructure/docker/github/Dockerfile
      target: github
    image: kr0n/github:${IMAGE_TAG:-dev}
    container_name: kr0n-github
    restart: unless-stopped
    environment:
      KR0N_ENV: ${KR0N_ENV:-dev}
      GITHUB_GRPC_PORT: ${GITHUB_GRPC_PORT:-50052}
      AUTH_GRPC_ADDR: ${AUTH_GRPC_ADDR:-auth:50051}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_HTTP_TIMEOUT: ${GITHUB_HTTP_TIMEOUT:-5s}
      GITHUB_CACHE_TTL: ${GITHUB_CACHE_TTL:-2m}
      GITHUB_MAX_RESPONSE_BYTES: ${GITHUB_MAX_RESPONSE_BYTES:-4194304}
      AUDIT_RABBITMQ_URL: ${AUDIT_RABBITMQ_URL:-amqp://${AUDIT_RABBITMQ_USER:-guest}:${AUDIT_RABBITMQ_PASSWORD:-guest}@audit-rabbitmq:5672/}
      AUDIT_EXCHANGE_NAME: ${AUDIT_EXCHANGE_NAME:-audit.events}
    ports:
      - "${GITHUB_GRPC_HOST_PORT:-50052}:50052"
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - control_plane
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  control_plane:
    name: kr0n_control_plane
    external: true
