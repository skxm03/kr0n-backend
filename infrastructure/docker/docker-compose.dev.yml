name: kr0n-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: kr0n-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-kr0n}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-kr0n_dev_password}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-kr0n}
    ports:
      - "5433:5432"
    volumes:
      - kr0n_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kr0n} -d $${POSTGRES_DB:-kr0n}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kr0n-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kr0n_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kr0n-dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - kr0n_dev_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  audit-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kr0n-dev-audit-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${AUDIT_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${AUDIT_RABBITMQ_PASSWORD:-guest}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - kr0n_dev_audit_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: kr0n-dev-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: kr0n-dev-swagger-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      URLS: "[{url: 'specs/auth.swagger.json', name: 'Auth API'}, {url: 'specs/github.swagger.json', name: 'GitHub VCS API'}]"
      WITH_CREDENTIALS: "true"
    volumes:
      - ../../control-plane/gen/openapiv2/auth/v1/auth.swagger.json:/usr/share/nginx/html/specs/auth.swagger.json:ro
      - ../../control-plane/gen/openapiv2/github/v1/github.swagger.json:/usr/share/nginx/html/specs/github.swagger.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  kr0n_dev_postgres_data:
    name: kr0n_dev_postgres_data
  kr0n_dev_redis_data:
    name: kr0n_dev_redis_data
  kr0n_dev_rabbitmq_data:
    name: kr0n_dev_rabbitmq_data
  kr0n_dev_audit_rabbitmq_data:
    name: kr0n_dev_audit_rabbitmq_data
